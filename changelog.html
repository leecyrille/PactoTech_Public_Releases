<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacto Tech — Release Notes</title>
<style>
  :root { --cyan:#3bbfe8; --bg:#14181d; --card:#1c2229; --line:#2e3944;
           --txt:#e8eef2; --dim:#8fa1ae; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt);
         font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
         line-height:1.6; padding:40px 18px 80px; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { color:var(--cyan); font-size:26px; letter-spacing:.02em; }
  .sub { color:var(--dim); margin:6px 0 26px; }
  .toggle { display:flex; align-items:center; gap:8px; margin-bottom:22px;
            color:var(--dim); font-size:14px; user-select:none; }
  .entry { background:var(--card); border:1px solid var(--line);
           border-radius:12px; padding:18px 22px; margin-bottom:14px; }
  .entry.beta { display:none; }
  body.show-beta .entry.beta { display:block; }
  .head { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
          margin-bottom:8px; }
  .ver { font-weight:700; font-size:17px; }
  .date { color:var(--dim); font-size:13px; }
  .chip { font-size:11px; font-weight:700; letter-spacing:.05em;
          padding:2px 9px; border-radius:999px; text-transform:uppercase; }
  .chip.production { background:#123a2a; color:#4cd47a; }
  .chip.beta { background:#3a2a12; color:#f2b23e; }
  .chip.app { background:#12303a; color:var(--cyan); }
  .chip.firmware { background:#241a3a; color:#a55eea; }
  .chip.both { background:#122c3a; color:#7df9ff; }
  .boards { color:var(--dim); font-size:12.5px; }
  .notes p { margin:6px 0; color:#c9d4dc; }
  .empty { color:var(--dim); }
  footer { margin-top:40px; color:var(--dim); font-size:12.5px; }
  a { color:var(--cyan); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pacto Tech — Release Notes</h1>
  <p class="sub">Updates for the Pacto Tech Utility app and controller firmware.</p>
  <label class="toggle"><input type="checkbox" id="beta"
    onchange="document.body.classList.toggle('show-beta', this.checked)">
    Show beta releases</label>
  <p class="empty">No releases published yet.</p>
  <footer>Pacto Tech &middot; <a href="https://pactotech.com">pactotech.com</a></footer>
</div>
</body>
</html>
